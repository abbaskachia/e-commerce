<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&R Collection</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <h1>B&R COLLECTION</h1>

        <div class="cart" onclick="openCart()">
            🛒 CART
            (<span id="cart-count">0</span>)
        </div>
    </header>
    <section class="hero">
        <h2>
            Welcome to B&R Collection
        </h2>
        <p>
            Quality products at affordable prices.
        </p>
    </section>
    <h2 class="title">
        Our Products
    </h2>
    <section class="products">
        <div class="product">
            <img src="images/Tshirt.jpg"alt="Black T-Shirt">
            <h3>
                Black T-Shirt
            </h3>
            <p>
                ₦10,000
            </p>
            <button onclick="addToCart(this)">
                🛒 Add to Cart
            </button>
        </div>
        <div class="product">
            <img src="images/classicshoe.jpg"alt="White Sneakers">

            <h3>
                White Sneakers
            </h3>

            <p>
                ₦25,000
            </p>
            <button onclick="addToCart(this)">

                🛒 Add to Cart
            </button>
        </div>
        <div class="product">
            <img src="images/handbag.jpg"alt="Laptop Backpack">
            <h3>
                Laptop Backpack
            </h3>
            <p>
                ₦20,000
            </p>
            <button onclick="addToCart(this)">
                🛒 Add to Cart
            </button>
        </div>
        <div class="product">

            <img src="images/watch.jpg"alt="Wrist Watch">

            <h3>
                Wrist Watch
            </h3>

            <p>
                ₦15,000
            </p>
            <button onclick="addToCart(this)">
                🛒 Add to Cart
            </button>
        </div>

    </section>
    <div
        id="cart-overlay"
        onclick="closeCart()"
    ></div>
    <div id="cart-panel">
        <div class="cart-header">

            <h2>
                🛒 My Cart
            </h2>
            <button onclick="closeCart()">
                ✕
            </button>
        </div>
        <div id="cart-items">
            <p>
                Your cart is empty.
            </p>

        </div>
        <div class="cart-bottom">
            <h3>
                Total:
                <span id="cart-total">0</span>
            </h3>
            <button class="checkout-button">
                Checkout
            </button>
        </div>
    </div>
    <footer>
        <p>
             2026 B&R Collection
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
